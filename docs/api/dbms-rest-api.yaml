openapi: 3.0.3
info:
  title: DBMS REST API
  description: REST API documentation for a Database Management System. The API supports catalog browsing, database object
    management, data operations, SQL query processing, and transaction management.
  version: 1.0.0
servers:
- url: http://localhost:8080/api/v1
  description: Local development server
tags:
- name: Catalog
- name: Databases
- name: Schemas
- name: Tables
- name: Columns
- name: Constraints
- name: Indexes
- name: Partitions
- name: Triggers
- name: Views
- name: Stored Procedures
- name: Sequences
- name: Rows
- name: Queries
- name: Transactions
paths:
  /catalog/databases:
    get:
      tags:
      - Catalog
      summary: List databases in catalog
      operationId: listCatalogDatabases
      responses:
        '200':
          description: List of database resources
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DatabaseListResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalServerError'
      parameters:
      - name: page
        in: query
        schema:
          type: integer
          minimum: 0
          default: 0
      - name: size
        in: query
        schema:
          type: integer
          minimum: 1
          maximum: 200
          default: 20
      - name: sort
        in: query
        schema:
          type: string
        description: Sorting expression, for example name,asc
      description: Retrieves all databases registered in the system catalog. This operation reads metadata only and does not
        open or load the databases.
  /catalog/databases/{databaseId}/schemas:
    get:
      tags:
      - Catalog
      summary: List schemas in catalog database
      operationId: listCatalogSchemas
      responses:
        '200':
          description: List of schema resources
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SchemaListResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalServerError'
      parameters:
      - $ref: '#/components/parameters/databaseId'
      - name: page
        in: query
        schema:
          type: integer
          minimum: 0
          default: 0
      - name: size
        in: query
        schema:
          type: integer
          minimum: 1
          maximum: 200
          default: 20
      - name: sort
        in: query
        schema:
          type: string
        description: Sorting expression, for example name,asc
      description: Retrieves all schemas that belong to the specified database from the system catalog.
  /catalog/schemas/{schemaId}/objects:
    get:
      tags:
      - Catalog
      summary: List objects in catalog schema
      operationId: listCatalogObjects
      responses:
        '200':
          description: Catalog objects
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  additionalProperties: true
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalServerError'
      parameters:
      - $ref: '#/components/parameters/schemaId'
      - name: page
        in: query
        schema:
          type: integer
          minimum: 0
          default: 0
      - name: size
        in: query
        schema:
          type: integer
          minimum: 1
          maximum: 200
          default: 20
      - name: sort
        in: query
        schema:
          type: string
        description: Sorting expression, for example name,asc
      description: Retrieves database objects that belong to the specified schema, such as tables, views, stored procedures,
        and sequences.
  /catalog/search:
    get:
      tags:
      - Catalog
      summary: Search catalog objects
      operationId: searchCatalog
      responses:
        '200':
          description: Search results
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  additionalProperties: true
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalServerError'
      parameters:
      - name: q
        in: query
        required: true
        schema:
          type: string
      - name: type
        in: query
        schema:
          type: string
      - name: page
        in: query
        schema:
          type: integer
          minimum: 0
          default: 0
      - name: size
        in: query
        schema:
          type: integer
          minimum: 1
          maximum: 200
          default: 20
      - name: sort
        in: query
        schema:
          type: string
        description: Sorting expression, for example name,asc
      description: Searches the system catalog for database objects by keyword and optional object type.
  /databases:
    post:
      tags:
      - Databases
      summary: Create database
      operationId: createDatabase
      responses:
        '201':
          description: Database created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Database'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalServerError'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DatabaseCreateRequest'
      description: Creates the metadata and initial structure for a new database. The system validates duplicate names, storage
        configuration, and applicable business rules before creation.
    get:
      tags:
      - Databases
      summary: List database resources
      operationId: listDatabases
      responses:
        '200':
          description: List of database resources
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DatabaseListResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalServerError'
      parameters:
      - name: page
        in: query
        schema:
          type: integer
          minimum: 0
          default: 0
      - name: size
        in: query
        schema:
          type: integer
          minimum: 1
          maximum: 200
          default: 20
      - name: sort
        in: query
        schema:
          type: string
        description: Sorting expression, for example name,asc
      description: Retrieves the databases that the current user is authorized to view. Pagination and sorting are supported.
  /databases/{databaseId}:
    get:
      tags:
      - Databases
      summary: Get database
      operationId: getDatabase
      responses:
        '200':
          description: Database returned successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Database'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalServerError'
      parameters:
      - $ref: '#/components/parameters/databaseId'
      description: Retrieves detailed information about a database by its databaseId, including its name, current state, and
        timestamps.
    patch:
      tags:
      - Databases
      summary: Update database
      operationId: updateDatabase
      responses:
        '200':
          description: Database updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Database'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalServerError'
      parameters:
      - $ref: '#/components/parameters/databaseId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DatabaseUpdateRequest'
      description: Partially updates the configuration or metadata of a database. Only fields included in the request body
        are changed.
    delete:
      tags:
      - Databases
      summary: Delete database
      operationId: deleteDatabase
      responses:
        '204':
          description: Operation completed successfully
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalServerError'
      parameters:
      - $ref: '#/components/parameters/databaseId'
      description: Deletes a database and its related metadata. The operation may be rejected when the database is open or
        still has unresolved dependencies.
  /databases/{databaseId}/schemas:
    post:
      tags:
      - Schemas
      summary: Create schema
      operationId: createSchema
      responses:
        '201':
          description: Schema created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Schema'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalServerError'
      parameters:
      - $ref: '#/components/parameters/databaseId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SchemaCreateRequest'
      description: Creates a new schema inside the specified database.
    get:
      tags:
      - Schemas
      summary: List schema resources
      operationId: listSchemas
      responses:
        '200':
          description: List of schema resources
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SchemaListResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalServerError'
      parameters:
      - $ref: '#/components/parameters/databaseId'
      - name: page
        in: query
        schema:
          type: integer
          minimum: 0
          default: 0
      - name: size
        in: query
        schema:
          type: integer
          minimum: 1
          maximum: 200
          default: 20
      - name: sort
        in: query
        schema:
          type: string
        description: Sorting expression, for example name,asc
      description: Retrieves all schemas that belong to the specified database.
  /schemas/{schemaId}:
    get:
      tags:
      - Schemas
      summary: Get schema
      operationId: getSchema
      responses:
        '200':
          description: Schema returned successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Schema'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalServerError'
      parameters:
      - $ref: '#/components/parameters/schemaId'
      description: Retrieves detailed metadata for a specific schema.
    patch:
      tags:
      - Schemas
      summary: Update schema
      operationId: updateSchema
      responses:
        '200':
          description: Schema updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Schema'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalServerError'
      parameters:
      - $ref: '#/components/parameters/schemaId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SchemaUpdateRequest'
      description: Updates the schema name or other schema metadata that can be modified.
    delete:
      tags:
      - Schemas
      summary: Delete schema
      operationId: deleteSchema
      responses:
        '204':
          description: Operation completed successfully
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalServerError'
      parameters:
      - $ref: '#/components/parameters/schemaId'
      description: Deletes a schema. The operation may fail if the schema still contains database objects.
  /schemas/{schemaId}/tables:
    post:
      tags:
      - Tables
      summary: Create table
      operationId: createTable
      responses:
        '201':
          description: Table created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Table'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalServerError'
      parameters:
      - $ref: '#/components/parameters/schemaId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TableCreateRequest'
      description: Creates a new table in the specified schema using the supplied table name and initial structure.
    get:
      tags:
      - Tables
      summary: List table resources
      operationId: listTables
      responses:
        '200':
          description: List of table resources
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TableListResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalServerError'
      parameters:
      - $ref: '#/components/parameters/schemaId'
      - name: page
        in: query
        schema:
          type: integer
          minimum: 0
          default: 0
      - name: size
        in: query
        schema:
          type: integer
          minimum: 1
          maximum: 200
          default: 20
      - name: sort
        in: query
        schema:
          type: string
        description: Sorting expression, for example name,asc
      description: Retrieves all tables that belong to the specified schema.
  /tables/{tableId}:
    get:
      tags:
      - Tables
      summary: Get table
      operationId: getTable
      responses:
        '200':
          description: Table returned successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Table'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalServerError'
      parameters:
      - $ref: '#/components/parameters/tableId'
      description: Retrieves the metadata and structural information of a specific table.
    patch:
      tags:
      - Tables
      summary: Update table
      operationId: updateTable
      responses:
        '200':
          description: Table updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Table'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalServerError'
      parameters:
      - $ref: '#/components/parameters/tableId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TableUpdateRequest'
      description: Updates table metadata or other table properties that can be modified.
    delete:
      tags:
      - Tables
      summary: Delete table
      operationId: deleteTable
      responses:
        '204':
          description: Operation completed successfully
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalServerError'
      parameters:
      - $ref: '#/components/parameters/tableId'
      description: Deletes a table together with its data and dependent objects according to the configured deletion policy.
  /tables/{tableId}/columns:
    post:
      tags:
      - Columns
      summary: Create column
      operationId: createColumn
      responses:
        '201':
          description: Column created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Column'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalServerError'
      parameters:
      - $ref: '#/components/parameters/tableId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ColumnCreateRequest'
      description: Adds a new column to a table with its name, data type, nullability, and other column properties.
    get:
      tags:
      - Columns
      summary: List column resources
      operationId: listColumns
      responses:
        '200':
          description: List of column resources
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ColumnListResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalServerError'
      parameters:
      - $ref: '#/components/parameters/tableId'
      - name: page
        in: query
        schema:
          type: integer
          minimum: 0
          default: 0
      - name: size
        in: query
        schema:
          type: integer
          minimum: 1
          maximum: 200
          default: 20
      - name: sort
        in: query
        schema:
          type: string
        description: Sorting expression, for example name,asc
      description: Retrieves all columns of a table, including their defined order.
  /columns/{columnId}:
    get:
      tags:
      - Columns
      summary: Get column
      operationId: getColumn
      responses:
        '200':
          description: Column returned successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Column'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalServerError'
      parameters:
      - $ref: '#/components/parameters/columnId'
      description: Retrieves the complete definition of a specific column.
    patch:
      tags:
      - Columns
      summary: Update column
      operationId: updateColumn
      responses:
        '200':
          description: Column updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Column'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalServerError'
      parameters:
      - $ref: '#/components/parameters/columnId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ColumnUpdateRequest'
      description: Updates a column definition, such as its name, data type, or nullability.
    delete:
      tags:
      - Columns
      summary: Delete column
      operationId: deleteColumn
      responses:
        '204':
          description: Operation completed successfully
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalServerError'
      parameters:
      - $ref: '#/components/parameters/columnId'
      description: Deletes a column from a table. The system checks constraints, indexes, and dependencies before removal.
  /tables/{tableId}/partitions:
    post:
      tags:
      - Partitions
      summary: Create partition
      operationId: createPartition
      responses:
        '201':
          description: Partition created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Partition'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalServerError'
      parameters:
      - $ref: '#/components/parameters/tableId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PartitionCreateRequest'
      description: Creates a new table partition according to the configured partitioning strategy.
    get:
      tags:
      - Partitions
      summary: List partition resources
      operationId: listPartitions
      responses:
        '200':
          description: List of partition resources
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PartitionListResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalServerError'
      parameters:
      - $ref: '#/components/parameters/tableId'
      - name: page
        in: query
        schema:
          type: integer
          minimum: 0
          default: 0
      - name: size
        in: query
        schema:
          type: integer
          minimum: 1
          maximum: 200
          default: 20
      - name: sort
        in: query
        schema:
          type: string
        description: Sorting expression, for example name,asc
      description: Retrieves all partitions defined for the specified table.
  /partitions/{partitionId}:
    get:
      tags:
      - Partitions
      summary: Get partition
      operationId: getPartition
      responses:
        '200':
          description: Partition returned successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Partition'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalServerError'
      parameters:
      - $ref: '#/components/parameters/partitionId'
      description: Retrieves detailed information about a specific partition.
    patch:
      tags:
      - Partitions
      summary: Update partition
      operationId: updatePartition
      responses:
        '200':
          description: Partition updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Partition'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalServerError'
      parameters:
      - $ref: '#/components/parameters/partitionId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PartitionUpdateRequest'
      description: Updates the metadata or modifiable configuration of a partition.
    delete:
      tags:
      - Partitions
      summary: Delete partition
      operationId: deletePartition
      responses:
        '204':
          description: Operation completed successfully
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalServerError'
      parameters:
      - $ref: '#/components/parameters/partitionId'
      description: Deletes a partition according to the system's configured data-handling policy.
  /tables/{tableId}/triggers:
    post:
      tags:
      - Triggers
      summary: Create trigger
      operationId: createTrigger
      responses:
        '201':
          description: Trigger created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Trigger'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalServerError'
      parameters:
      - $ref: '#/components/parameters/tableId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TriggerCreateRequest'
      description: Creates a trigger for a table and associates it with an INSERT, UPDATE, or DELETE event.
