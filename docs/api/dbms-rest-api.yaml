            application/json:
              schema:
                $ref: '#/components/schemas/Row'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalServerError'
      parameters:
      - $ref: '#/components/parameters/tableId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RowCreateRequest'
      description: Inserts a new row into the table. The system validates data types, constraints, and transaction rules before
        writing the data.
    get:
      tags:
      - Rows
      summary: List rows
      operationId: listRows
      responses:
        '200':
          description: List of row resources
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RowListResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalServerError'
      parameters:
      - $ref: '#/components/parameters/tableId'
      - name: page
        in: query
        schema:
          type: integer
          minimum: 0
          default: 0
      - name: size
        in: query
        schema:
          type: integer
          minimum: 1
          maximum: 200
          default: 20
      - name: sort
        in: query
        schema:
          type: string
        description: Sorting expression, for example name,asc
      - name: filter
        in: query
        schema:
          type: string
        description: Implementation-defined filter expression
      description: Retrieves rows from the specified table with optional pagination, sorting, and filtering.
