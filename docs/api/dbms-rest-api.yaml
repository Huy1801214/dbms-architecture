    QueryExecuteRequest:
      type: object
      required:
      - sql
      properties:
        sql:
          type: string
          example: SELECT * FROM students
        databaseId:
          type: string
          format: uuid
        transactionId:
          type: string
          format: uuid
        timeoutSeconds:
          type: integer
          minimum: 1
          default: 30
        parameters:
          type: object
          additionalProperties: true
    QueryExplainRequest:
      type: object
      required:
      - sql
      properties:
        sql:
          type: string
        databaseId:
          type: string
          format: uuid
        analyze:
          type: boolean
          default: false
    QueryResult:
      type: object
      properties:
        queryId:
          type: string
          format: uuid
        status:
          type: string
          enum:
          - QUEUED
          - RUNNING
          - COMPLETED
          - FAILED
          - CANCELLED
        columns:
          type: array
