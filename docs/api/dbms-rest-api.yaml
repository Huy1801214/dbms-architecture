            application/json:
              schema:
                $ref: '#/components/schemas/Transaction'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalServerError'
      parameters:
      - $ref: '#/components/parameters/transactionId'
      description: Commits all changes made within the transaction and makes them permanent.
  /transactions/{transactionId}/rollback:
    post:
      tags:
      - Transactions
      summary: Rollback transaction
      operationId: rollbackTransaction
      responses:
        '200':
          description: Transaction rollback completed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Transaction'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalServerError'
      parameters:
      - $ref: '#/components/parameters/transactionId'
      description: Discards all uncommitted changes and restores the data to its state before the transaction.
