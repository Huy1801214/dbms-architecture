          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalServerError'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/QueryExplainRequest'
      description: Analyzes a SQL statement and returns its logical plan, physical plan, and estimated cost without necessarily
        executing the query.
  /queries/{queryId}:
    get:
      tags:
      - Queries
      summary: Get query status or result
      operationId: getQuery
      responses:
        '200':
          description: Query status or result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QueryResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalServerError'
      parameters:
      - $ref: '#/components/parameters/queryId'
      description: Retrieves the current status or execution result of a previously submitted query.
    delete:
      tags:
      - Queries
      summary: Cancel query
      operationId: cancelQuery
      responses:
        '202':
          description: Query cancellation accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ActionResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalServerError'
      parameters:
      - $ref: '#/components/parameters/queryId'
      description: Requests cancellation of a query that is queued or currently running.
  /transactions:
    post:
      tags:
      - Transactions
      summary: Begin transaction
      operationId: beginTransaction
      responses:
        '201':
          description: Transaction started
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Transaction'
        '400':
          $ref: '#/components/responses/BadRequest'
