      parameters:
      - $ref: '#/components/parameters/tableId'
      - $ref: '#/components/parameters/rowId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RowUpdateRequest'
      description: Partially updates a row. Only the columns included in the request body are changed.
    delete:
      tags:
      - Rows
      summary: Delete row
      operationId: deleteRow
      responses:
        '204':
          description: Operation completed successfully
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalServerError'
      parameters:
      - $ref: '#/components/parameters/tableId'
      - $ref: '#/components/parameters/rowId'
      description: Deletes a specific row from the table by its rowId.
  /queries:
    post:
      tags:
      - Queries
      summary: Execute SQL query
      operationId: executeQuery
      responses:
        '202':
          description: Query accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QueryResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalServerError'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/QueryExecuteRequest'
      description: Submits a SQL statement to the query processing engine. The system parses, validates, optimizes, and executes
        the query, and the result may be returned asynchronously.
  /queries/explain:
    post:
      tags:
      - Queries
      summary: Explain SQL query
      operationId: explainQuery
      responses:
        '200':
          description: Query execution plan
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExplainResult'
